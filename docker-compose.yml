services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: petcenter-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: PETCENTER
      APP_USER_PASSWORD: petcenter
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database:/database:ro
      - ./database/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  app:
    build: .
    container_name: petcenter-api
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: PETCENTER
      SPRING_DATASOURCE_PASSWORD: petcenter
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      JWT_SECRET: cGV0Y2VudGVyLWRldm9wcy1sb2NhbC1qd3Qtc2VjcmV0LTIwMjYtc3ByaW50NA==

volumes:
  oracle-data:
