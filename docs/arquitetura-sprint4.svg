ll com identidade</text><text class="body" x="665" y="540">gerenciada + AcrPull</text><rect class="box" x="940" y="410" width="310" height="185" rx="12"/><rect x="940" y="410" width="310" height="7" rx="3" fill="#2467a4"/><text class="label" x="955" y="442">AZURE PIPELINES | CD</text><text class="body" x="955" y="471">5. Baixa artefato do CI aprovado</text><text class="body" x="955" y="494">Confere checksum do JAR</text><text class="body" x="955" y="517">Docker build sem recompilar</text><text class="body" x="955" y="540">Azure CLI + service connection</text><path class="flow" d="M1090 310 V410"/><text class="label" x="895" y="358">5. disparo automatico</text><path class="flow" d="M940 495 H890"/><text class="label" x="892" y="477">6.</text><path class="flow" d="M650 495 H600"/><text class="label" x="603" y="477">7.</text><path class="flow" d="M320 495 H270"/><text class="label" x="267" y="477">10.</text><path class="flow" d="M1090 595 V635 H460 V595"/><text class="label" x="585" y="628">8. deploy automatico + smoke HTTP</text><rect class="box" x="320" y="700" width="280" height="110" rx="12"/><rect x="320" y="700" width="280" height="7" rx="3" fill="#258a78"/><text class="label" x="335" y="732">USUARIO FINAL / TUTOR</text><text class="body" x="335" y="761">9. Acesso a API / Swagger</text><text class="body" x="335" y="784">CRUD por HTTP ou cliente REST</text><path class="flow" d="M460 700 V642"/><text class="label" x="475" y="680">9. CRUD</text><rect class="box" x="30" y="700" width="240" height="110" rx="12"/><rect x="30" y="700" width="240" height="7" rx="3" fill="#258a78"/><text class="label" x="45" y="732">ALUNO / CLIENTE SQL</text><text class="body" x="45" y="761">SELECT a cada operacao</text><text class="body" x="45" y="784">Evidencia de persistencia</text><path class="flow" d="M145 700 V595"/><text class="label" x="42" y="660">10. SELECT</text><text class="sub" x="650" y="730">Segredos: variable group protegido no Azure DevOps</text><text class="sub" x="650" 