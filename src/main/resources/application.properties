spring.application.name=challengepetcenter
springdoc.info.title=API para acompahamento do pet - PetCenter
springdoc.info.description=API para acompanhamento diario da saude e humor dos pets
springdoc.info.version=v1.0.0
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.try-it-out-enabled=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:PETCENTER}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:petcenter}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.OracleDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
#server.servlet.context-path=/api
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
jwt.secret=${JWT_SECRET:cGV0Y2VudGVyLWRldm9wcy1sb2NhbC1qd3Qtc2VjcmV0LTIwMjYtc3ByaW50NA==}
